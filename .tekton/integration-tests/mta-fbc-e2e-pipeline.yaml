apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: mta-fbc-e2e-pipeline
spec:
  description: |
    Deploy MTA operator from FBC catalog to a leased pool cluster and run E2E tests.
    Uses OCPCTL cluster pools for instant access to pre-provisioned clusters.
    Faster than ephemeral clusters (no 15-30 min provision wait).

  params:
    - name: SNAPSHOT
      description: Application Snapshot JSON
      type: string
    - name: poolName
      description: Name of the cluster pool to lease from
      type: string
      default: "ci-sno-pool-1"

  results:
    - name: IMAGE_VERIFICATION
      description: Pre-flight image pullability check status
      value: $(tasks.verify-image-pullable.results.verificationStatus)
    - name: LEASE_STATUS
      description: Pool cluster lease status
      value: $(tasks.lease-cluster.results.leaseStatus)
    - name: CLUSTER_NAME
      description: Name of the leased cluster
      value: $(tasks.lease-cluster.results.clusterName)
    - name: DEPLOYMENT_STATUS
      description: Operator deployment status
      value: $(tasks.deploy-operator.results.deploymentStatus)
    - name: TEST_OUTPUT
      description: Test execution result
      value: $(tasks.run-e2e-tests.results.testStatus)

  tasks:
    - name: parse-metadata
      params:
        - name: SNAPSHOT
          value: $(params.SNAPSHOT)
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/konflux-ci/integration-examples
          - name: revision
            value: a1a70b0a1cfc96f5216d472fbd60f6b42780b3e5
          - name: pathInRepo
            value: tasks/test_metadata.yaml

    - name: verify-image-pullable
      runAfter:
        - parse-metadata
      params:
        - name: fbcImage
          value: $(tasks.parse-metadata.results.component-container-image)
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/migtools/mta-tackle2-ui
          - name: revision
            value: slack_notification
          - name: pathInRepo
            value: .tekton/tasks/verify-image-pullable.yaml

    - name: lease-cluster
      runAfter:
        - verify-image-pullable
      params:
        - name: poolName
          value: $(params.poolName)
        - name: leaseDuration
          value: "4"
        - name: purpose
          value: "MTA FBC E2E Testing"
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/migtools/mta-tackle2-ui
          - name: revision
            value: slack_notification
          - name: pathInRepo
            value: .tekton/tasks/ocpctl-pool-lease.yaml

    - name: cleanup-existing-mta
      runAfter:
        - lease-cluster
      params:
        - name: clusterId
          value: $(tasks.lease-cluster.results.clusterId)
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/migtools/mta-tackle2-ui
          - name: revision
            value: slack_notification
          - name: pathInRepo
            value: .tekton/tasks/cleanup-mta.yaml

    - name: deploy-operator
      runAfter:
        - cleanup-existing-mta
      params:
        - name: clusterId
          value: $(tasks.lease-cluster.results.clusterId)
        - name: fbcImage
          value: $(tasks.parse-metadata.results.component-container-image)
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/migtools/mta-tackle2-ui
          - name: revision
            value: slack_notification
          - name: pathInRepo
            value: .tekton/tasks/deploy-mta-operator.yaml

    - name: run-e2e-tests
      runAfter:
        - deploy-operator
      params:
        - name: uiRoute
          value: $(tasks.deploy-operator.results.uiRoute)
      taskSpec:
        params:
          - name: uiRoute
        results:
          - name: testStatus
            description: Test execution status (PASSED or FAILED)
        stepTemplate:
          computeResources:
            requests:
              memory: 4Gi
              cpu: "2"
            limits:
              memory: 8Gi
              cpu: "4"
        steps:
          - name: run-tests
            image: cypress/included:15.7.0
            env:
              - name: CYPRESS_CACHE_FOLDER
                value: /tmp/.cache/Cypress
              - name: npm_config_cache
                value: /tmp/.cache/npm
              - name: NODE_TLS_REJECT_UNAUTHORIZED
                value: "0"
            script: |
              #!/bin/bash
              set -euo pipefail
              trap 'echo "FAILED" > $(results.testStatus.path)' ERR

              echo "Installing curl and jq for test utilities..."
              apt-get update -qq && apt-get install -y -qq curl jq > /dev/null 2>&1

              UI_ROUTE="$(params.uiRoute)"
              BASE_URL="https://${UI_ROUTE}"

              echo "MTA UI URL: $BASE_URL"

              echo "Cloning tackle2-ui repository..."
              cd /tmp
              git clone --depth 1 --branch main https://github.com/migtools/mta-tackle2-ui.git
              cd mta-tackle2-ui

              echo "Installing dependencies..."
              npm clean-install --ignore-scripts --no-audit
              npx cypress install

              cd cypress
              cp .env.example .env

              echo "Running all tests: @ci + @tier0-3 (excluding tests requiring secrets)"

              # Build spec file list from tier tags
              TEST_TAGS="@ci,@tier0,@tier2_A,@tier3_A,@tier3_B,@tier3_C,@tier3_D,@tier3_E,@tier3_F"
              echo "Finding test files matching tags: $TEST_TAGS"
              ALL_SPEC_FILES=$(node scripts/findTierFiles.mjs "$TEST_TAGS")

              if [ -z "$ALL_SPEC_FILES" ]; then
                echo "ERROR: No test files found matching tags: $TEST_TAGS"
                echo "FAILED" > $(results.testStatus.path)
                exit 1
              fi

              echo "Found $(echo "$ALL_SPEC_FILES" | tr ',' '\n' | wc -l) files with matching tags"

              # Filter out files requiring secrets
              echo "Excluding files requiring secrets..."
              SPEC_FILES=$(echo "$ALL_SPEC_FILES" | tr ',' '\n' | grep -v -E '(custom-metrics|jira|proxy|sourcecontrol_crud|maven_crud|repository/git|repository/maven|repository/subversion|export_to_jira|discovery\.test)' | tr '\n' ',' | sed 's/,$//')

              if [ -z "$SPEC_FILES" ]; then
                echo "ERROR: No test files remaining after filtering secrets"
                echo "FAILED" > $(results.testStatus.path)
                exit 1
              fi

              FILE_COUNT=$(echo "$SPEC_FILES" | tr ',' '\n' | wc -l)
              echo "Found $FILE_COUNT test files to run"

              export CYPRESS_INCLUDE_TAGS="$TEST_TAGS"

              if npx dotenvx run -- npx cypress run \
                --spec "$SPEC_FILES" \
                --config-file cypress.config.ts \
                --config baseUrl="$BASE_URL",chromeWebSecurity=false,video=false; then
                echo "PASSED" > $(results.testStatus.path)
              else
                echo "FAILED" > $(results.testStatus.path)
                exit 1
              fi

  finally:
    - name: release-cluster
      when:
        - input: "$(tasks.lease-cluster.status)"
          operator: in
          values: ["Succeeded"]
      params:
        - name: clusterId
          value: $(tasks.lease-cluster.results.clusterId)
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/migtools/mta-tackle2-ui
          - name: revision
            value: slack_notification
          - name: pathInRepo
            value: .tekton/tasks/ocpctl-pool-release.yaml

    - name: slack-notification
      when:
        - input: "$(tasks.run-e2e-tests.status)"
          operator: in
          values: ["Succeeded", "Failed"]
      params:
        - name: testStatus
          value: "$(tasks.run-e2e-tests.status)"
        - name: pipelineRunName
          value: "$(context.pipelineRun.name)"
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/migtools/mta-tackle2-ui
          - name: revision
            value: slack_notification
          - name: pathInRepo
            value: .tekton/tasks/slack-notification.yaml
