apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: mta-fbc-e2e-pipeline
spec:
  description: |
    Deploy MTA operator from FBC catalog to ephemeral OCPCTL cluster and run E2E tests.
    Uses modular reusable tasks from .tekton/tasks/ for cluster lifecycle and operator deployment.

  params:
    - name: SNAPSHOT
      description: Application Snapshot JSON
      type: string

  results:
    - name: IMAGE_VERIFICATION
      description: Pre-flight image pullability check status
      value: $(tasks.verify-image-pullable.results.verificationStatus)
    - name: PROVISION_STATUS
      description: Cluster provisioning status (READY, TIMEOUT, or FAILED)
      value: $(tasks.provision-cluster.results.provisionStatus)
    - name: CLUSTER_NAME
      description: Name of the provisioned cluster
      value: $(tasks.provision-cluster.results.clusterName)
    - name: DEPLOYMENT_STATUS
      description: Operator deployment status
      value: $(tasks.deploy-operator.results.deploymentStatus)
    - name: TEST_OUTPUT
      description: Test execution result
      value: $(tasks.run-e2e-tests.results.testStatus)

  tasks:
    - name: parse-metadata
      params:
        - name: SNAPSHOT
          value: $(params.SNAPSHOT)
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/konflux-ci/integration-examples
          - name: revision
            value: a1a70b0a1cfc96f5216d472fbd60f6b42780b3e5
          - name: pathInRepo
            value: tasks/test_metadata.yaml

    - name: verify-image-pullable
      runAfter:
        - parse-metadata
      params:
        - name: fbcImage
          value: $(tasks.parse-metadata.results.component-container-image)
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/migtools/mta-tackle2-ui
          - name: revision
            value: slack_notification
          - name: pathInRepo
            value: .tekton/tasks/verify-image-pullable.yaml

    - name: provision-cluster
      runAfter:
        - verify-image-pullable
      params:
        - name: clusterName
          value: "$(context.pipelineRun.uid)"
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/migtools/mta-tackle2-ui
          - name: revision
            value: slack_notification
          - name: pathInRepo
            value: .tekton/tasks/ocpctl-provision.yaml

    - name: verify-provision
      runAfter:
        - provision-cluster
      params:
        - name: provisionStatus
          value: $(tasks.provision-cluster.results.provisionStatus)
      taskSpec:
        params:
          - name: provisionStatus
        steps:
          - name: check-status
            image: registry.access.redhat.com/ubi9/ubi-minimal:latest
            script: |
              #!/bin/bash
              STATUS="$(params.provisionStatus)"
              echo "Cluster provision status: $STATUS"

              if [ "$STATUS" != "READY" ]; then
                echo "❌ Cluster provisioning failed or timed out"
                echo "Cluster ID was saved and will be cleaned up in finally step"
                exit 1
              fi

              echo "✅ Cluster is ready, proceeding with deployment"

    - name: deploy-operator
      runAfter:
        - verify-provision
      params:
        - name: clusterId
          value: $(tasks.provision-cluster.results.clusterId)
        - name: fbcImage
          value: $(tasks.parse-metadata.results.component-container-image)
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/migtools/mta-tackle2-ui
          - name: revision
            value: slack_notification
          - name: pathInRepo
            value: .tekton/tasks/deploy-mta-operator.yaml

    - name: run-e2e-tests
      runAfter:
        - deploy-operator
      params:
        - name: uiRoute
          value: $(tasks.deploy-operator.results.uiRoute)
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/migtools/mta-tackle2-ui
          - name: revision
            value: slack_notification
          - name: pathInRepo
            value: .tekton/tasks/run-ui-e2e-tests.yaml

  finally:
    - name: cleanup-cluster
      params:
        - name: clusterId
          value: $(tasks.provision-cluster.results.clusterId)
        - name: clusterName
          value: "$(context.pipelineRun.uid)"
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/migtools/mta-tackle2-ui
          - name: revision
            value: slack_notification
          - name: pathInRepo
            value: .tekton/tasks/ocpctl-cleanup.yaml

    - name: slack-notification
      params:
        - name: testStatus
          value: "$(tasks.run-e2e-tests.status)"
        - name: pipelineRunName
          value: "$(context.pipelineRun.name)"
        - name: fbcImage
          value: "$(tasks.parse-metadata.results.component-container-image)"
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/migtools/mta-tackle2-ui
          - name: revision
            value: slack_notification
          - name: pathInRepo
            value: .tekton/tasks/slack-notification.yaml
