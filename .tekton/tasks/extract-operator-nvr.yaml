apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: extract-operator-nvr
  labels:
    app.kubernetes.io/version: "0.1"
  annotations:
    tekton.dev/pipelines.minVersion: "0.12.1"
    tekton.dev/categories: Utility
    tekton.dev/tags: metadata,nvr
    tekton.dev/displayName: "Extract Operator NVR"
spec:
  description: >-
    Extract operator NVR from bundle ClusterServiceVersion.
    Queries Konflux snapshots to find the corresponding operator bundle,
    extracts the CSV from the bundle image, and parses the operator container image.

  params:
    - name: snapshotJson
      type: string
      description: Konflux snapshot JSON from pipeline
    - name: registryPullSecretName
      type: string
      default: "registry-pull-secrets"
      description: Name of the Kubernetes Secret containing stage registry pull credentials
    - name: channelName
      type: string
      default: "stable-v8.2"
      description: OLM channel name to find bundle for

  results:
    - name: operatorNVR
      description: Full operator NVR (e.g., mta-operator-container-8.2.0-...)

  volumes:
    - name: stage-pull-secret
      secret:
        secretName: $(params.registryPullSecretName)
        optional: true

  steps:
    - name: extract-nvr
      image: registry.redhat.io/openshift4/ose-cli:latest
      volumeMounts:
        - name: stage-pull-secret
          mountPath: /stage-pull-secret
      script: |
        #!/bin/bash
        set -euo pipefail

        SNAPSHOT_JSON='$(params.snapshotJson)'

        echo "========================================="
        echo "Extracting Operator NVR from Bundle CSV"
        echo "========================================="

        # Install jq and yq for JSON/YAML parsing
        if ! command -v jq &> /dev/null; then
          echo "Installing jq..."
          curl -sL https://github.com/jqlang/jq/releases/download/jq-1.7.1/jq-linux-amd64 -o /usr/local/bin/jq
          chmod +x /usr/local/bin/jq
        fi

        if ! command -v yq &> /dev/null; then
          echo "Installing yq..."
          curl -sL https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -o /usr/local/bin/yq
          chmod +x /usr/local/bin/yq
        fi

        NVR=""
        CHANNEL_NAME="$(params.channelName)"

        # Extract FBC application from snapshot JSON
        FBC_APP=$(echo "$SNAPSHOT_JSON" | jq -r '.application // ""')

        if [ -z "$FBC_APP" ]; then
          echo "Warning: Could not extract application from snapshot JSON"
          FBC_APP="fbc-mta-8-2"
        fi

        echo "FBC Application: $FBC_APP"
        echo "Channel: $CHANNEL_NAME"

        # Get latest FBC snapshot for the application
        FBC_SNAPSHOT=$(oc get snapshots -n art-mta-tenant \
          -l appstudio.openshift.io/application=$FBC_APP \
          --sort-by=.metadata.creationTimestamp \
          -o jsonpath='{.items[-1].metadata.name}' 2>/dev/null || echo "")

        if [ -n "$FBC_SNAPSHOT" ]; then
          echo "FBC snapshot: $FBC_SNAPSHOT"
          echo ""

          # Get FBC image digest
          FBC_DIGEST=$(oc get snapshot $FBC_SNAPSHOT -n art-mta-tenant -o json | \
            jq -r '.spec.components[0].containerImage' | grep -o 'sha256:[a-f0-9]*')

          if [ -n "$FBC_DIGEST" ]; then
            echo "FBC digest: $FBC_DIGEST"
            FBC_IMAGE="quay.io/redhat-user-workloads/ocp-art-tenant/art-fbc@${FBC_DIGEST}"
            echo "FBC image: $FBC_IMAGE"
            echo ""

            # Extract FBC catalog
            echo "Extracting FBC catalog..."
            CATALOG_DIR="/tmp/fbc-catalog-$$"
            mkdir -p "$CATALOG_DIR"

            if oc image extract "$FBC_IMAGE" --filter-by-os=linux/amd64 \
               --path /configs/:"$CATALOG_DIR/" \
               --confirm 2>&1; then
              echo "✓ FBC catalog extracted"
              echo ""

              # Find catalog file
              CATALOG_FILE=$(find "$CATALOG_DIR" -name "catalog.yaml" -o -name "catalog.json" | head -1)

              if [ -f "$CATALOG_FILE" ]; then
                echo "✓ Found catalog: $(basename $CATALOG_FILE)"
                echo ""

                # Parse catalog to find latest bundle in channel
                echo "Parsing catalog for channel: $CHANNEL_NAME"

                # Get latest bundle name from channel
                LATEST_BUNDLE=$(yq eval "select(.schema == \"olm.channel\" and .name == \"$CHANNEL_NAME\") | .entries[-1].name" "$CATALOG_FILE")

                if [ -n "$LATEST_BUNDLE" ] && [ "$LATEST_BUNDLE" != "null" ]; then
                  echo "Latest bundle in channel: $LATEST_BUNDLE"
                  echo ""

                  # Get bundle image reference from catalog
                  BUNDLE_IMAGE=$(yq eval "select(.schema == \"olm.bundle\" and .name == \"$LATEST_BUNDLE\") | .image" "$CATALOG_FILE")

                  if [ -n "$BUNDLE_IMAGE" ] && [ "$BUNDLE_IMAGE" != "null" ]; then
                    echo "Bundle image from catalog: $BUNDLE_IMAGE"

                    # Convert registry.redhat.io to registry.stage.redhat.io
                    BUNDLE_IMAGE="${BUNDLE_IMAGE//registry.redhat.io/registry.stage.redhat.io}"
                    echo "Using stage registry: $BUNDLE_IMAGE"
                    echo ""

                    # Check if pull secret is available
                    REGISTRY_CONFIG_ARG=""
                    if [ -f /stage-pull-secret/.dockerconfigjson ]; then
                      REGISTRY_CONFIG_ARG="--registry-config=/stage-pull-secret/.dockerconfigjson"
                      echo "Using registry pull secret"
                    else
                      echo "Warning: No registry pull secret found, trying without credentials"
                    fi

                    # First, try to get operator version from bundle image labels
                    echo "Checking bundle image labels for operator metadata..."
                    if BUNDLE_INFO=$(oc image info "$BUNDLE_IMAGE" $REGISTRY_CONFIG_ARG -o json 2>/dev/null); then
                      # Look for operator-related version labels
                      OPERATOR_VERSION=$(echo "$BUNDLE_INFO" | jq -r '.config.Labels["operators.operatorframework.io/operator-version"] // .config.Labels["com.redhat.component.version"] // empty' 2>/dev/null)

                      if [ -n "$OPERATOR_VERSION" ]; then
                        echo "Found operator version in bundle labels: $OPERATOR_VERSION"
                        NVR="mta-operator-container-${OPERATOR_VERSION}"

                        echo ""
                        echo "========================================="
                        echo "✅ Extracted Operator NVR from bundle labels:"
                        echo "   $NVR"
                        echo "========================================="
                      fi
                    fi

                    # If not found in labels, extract bundle contents
                    if [ -z "$NVR" ]; then
                      echo "Extracting bundle contents..."
                      BUNDLE_DIR="/tmp/bundle-extract-$$"
                      mkdir -p "$BUNDLE_DIR/manifests" "$BUNDLE_DIR/metadata"

                      if oc image extract "$BUNDLE_IMAGE" $REGISTRY_CONFIG_ARG \
                         --path /manifests/:"$BUNDLE_DIR/manifests/" \
                         --path /metadata/:"$BUNDLE_DIR/metadata/" \
                         --confirm 2>&1; then
                        echo "✓ Bundle contents extracted successfully"
                        echo ""

                      # Find CSV file
                      CSV_FILE=$(find "$BUNDLE_DIR/manifests" -name "*clusterserviceversion.yaml" | head -1)

                      if [ -f "$CSV_FILE" ]; then
                        echo "✓ Found CSV: $(basename $CSV_FILE)"
                        echo ""

                        # Extract operator container image from CSV
                        echo "Extracting operator image from CSV..."
                        OPERATOR_IMAGE=$(yq eval '.spec.install.spec.deployments[].spec.template.spec.containers[] | select(.name == "mta-operator") | .image' "$CSV_FILE" 2>/dev/null | head -1)

                        if [ -n "$OPERATOR_IMAGE" ] && [ "$OPERATOR_IMAGE" != "null" ]; then
                          echo "Operator image from CSV: $OPERATOR_IMAGE"
                          echo ""

                          # Check if image uses digest or tag
                          if [[ "$OPERATOR_IMAGE" == *"@sha256:"* ]]; then
                            echo "Image uses digest - querying registry for tags..."

                            # Convert to stage registry
                            OPERATOR_IMAGE_STAGE="${OPERATOR_IMAGE//registry.redhat.io/registry.stage.redhat.io}"
                            echo "Querying: $OPERATOR_IMAGE_STAGE"

                            # Get image info to find tags
                            if IMAGE_INFO=$(oc image info "$OPERATOR_IMAGE_STAGE" $REGISTRY_CONFIG_ARG -o json 2>/dev/null); then
                              # Try to get tag from image metadata
                              # The image may have been pushed with a tag that we can find
                              IMAGE_TAG=$(echo "$IMAGE_INFO" | jq -r '.config.Labels["version"] // empty' 2>/dev/null)

                              if [ -n "$IMAGE_TAG" ]; then
                                echo "Found version label: $IMAGE_TAG"

                                # Construct operator NVR
                                NVR="mta-operator-container-${IMAGE_TAG}"

                                echo ""
                                echo "========================================="
                                echo "✅ Extracted Operator NVR from image labels:"
                                echo "   $NVR"
                                echo "========================================="
                              else
                                echo "⚠️ No version label found in operator image"
                              fi
                            else
                              echo "⚠️ Failed to query operator image"
                            fi
                          elif [[ "$OPERATOR_IMAGE" == *":"* ]]; then
                            # Image uses tag
                            IMAGE_TAG=$(echo "$OPERATOR_IMAGE" | sed 's/.*://')
                            echo "Image tag: $IMAGE_TAG"

                            # Construct operator NVR
                            NVR="mta-operator-container-${IMAGE_TAG}"

                            echo ""
                            echo "========================================="
                            echo "✅ Extracted Operator NVR from image tag:"
                            echo "   $NVR"
                            echo "========================================="
                          else
                            echo "⚠️ Cannot parse operator image format"
                          fi
                        else
                          echo "⚠️ Could not find mta-operator container in CSV"
                        fi
                      else
                        echo "⚠️ CSV file not found in bundle manifests"
                      fi

                        # Cleanup
                        rm -rf "$BUNDLE_DIR"
                      else
                        echo "⚠️ Failed to extract bundle manifests"
                      fi
                    fi  # End of if [ -z "$NVR" ]
                  else
                    echo "⚠️ Bundle image not found in catalog"
                  fi
                else
                  echo "⚠️ Latest bundle not found in channel $CHANNEL_NAME"
                fi
              else
                echo "⚠️ Catalog file not found"
              fi

              # Cleanup catalog
              rm -rf "$CATALOG_DIR"
            else
              echo "⚠️ Failed to extract FBC catalog"
            fi
          else
            echo "Warning: Could not extract FBC digest"
          fi
        else
          echo "Warning: No FBC snapshot found for $FBC_APP"
        fi

        # Write NVR to result (empty string if extraction failed)
        if [ -z "$NVR" ]; then
          echo ""
          echo "========================================="
          echo "⚠️ NVR extraction failed - using 'unknown'"
          echo "========================================="
          NVR="unknown"
        fi

        echo -n "$NVR" > $(results.operatorNVR.path)
