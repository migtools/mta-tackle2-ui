apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: extract-operator-nvr
  labels:
    app.kubernetes.io/version: "0.1"
  annotations:
    tekton.dev/pipelines.minVersion: "0.12.1"
    tekton.dev/categories: Utility
    tekton.dev/tags: metadata,nvr
    tekton.dev/displayName: "Extract Operator NVR"
spec:
  description: >-
    Extract operator NVR from FBC snapshot using Konflux-attached related-images artifact.
    Uses oras to discover and pull the related-images.json artifact, then inspects the
    bundle image for the com.redhat.art.nvr label (bundle metadata NVR).

  params:
    - name: snapshotJson
      type: string
      description: Konflux snapshot JSON from pipeline
    - name: pipelineRunName
      type: string
      default: ""
      description: Name of the PipelineRun (used to get snapshot name from labels)
    - name: registryPullSecretName
      type: string
      default: "registry-pull-secrets"
      description: Name of the Kubernetes Secret containing stage registry pull credentials

  results:
    - name: operatorNVR
      description: Full operator NVR (e.g., mta-operator-container-8.2.1-...)

  volumes:
    - name: stage-pull-secret
      secret:
        secretName: $(params.registryPullSecretName)
        optional: true

  steps:
    - name: extract-nvr
      image: registry.redhat.io/openshift4/ose-cli:latest
      volumeMounts:
        - name: stage-pull-secret
          mountPath: /stage-pull-secret
      script: |
        #!/bin/bash
        set -euo pipefail

        SNAPSHOT_JSON='$(params.snapshotJson)'

        echo "Extracting Operator NVR from FBC snapshot..."

        # Install dependencies
        if ! command -v jq &> /dev/null; then
          curl -sL https://github.com/jqlang/jq/releases/download/jq-1.7.1/jq-linux-amd64 -o /usr/local/bin/jq
          chmod +x /usr/local/bin/jq
        fi

        if ! command -v oras &> /dev/null; then
          ORAS_VERSION="1.2.0"
          curl -sL "https://github.com/oras-project/oras/releases/download/v${ORAS_VERSION}/oras_${ORAS_VERSION}_linux_amd64.tar.gz" | \
            tar -xz -C /usr/local/bin oras
          chmod +x /usr/local/bin/oras
        fi

        # Get snapshot name from current PipelineRun label
        PIPELINERUN_NAME="$(params.pipelineRunName)"

        if [ -n "$PIPELINERUN_NAME" ]; then
          SNAPSHOT_NAME=$(oc get pipelinerun "$PIPELINERUN_NAME" \
            -o jsonpath='{.metadata.labels.appstudio\.openshift\.io/snapshot}' 2>/dev/null || echo "unknown")
        else
          SNAPSHOT_NAME="unknown"
        fi

        # Get FBC image from snapshot JSON
        # Konflux snapshot format: {"application":"...","components":[{"name":"...","containerImage":"..."}]}
        FBC_IMAGE=$(echo "$SNAPSHOT_JSON" | jq -r '.components[0].containerImage // empty')

        if [ -z "$FBC_IMAGE" ]; then
          echo "ERROR: Could not extract FBC image from snapshot JSON"
          exit 1
        fi

        echo "Snapshot: $SNAPSHOT_NAME"
        echo "FBC image: $FBC_IMAGE"

        # Discover and pull related-images artifact
        echo "Discovering related-images artifact..."
        RELATED_IMAGES_DIGEST=$(oras discover --format json "$FBC_IMAGE" 2>/dev/null | \
          jq -r '.manifests[]? | select(.annotations.attachedMediaType == "application/vnd.konflux-ci.attached-artifact.related-images+json") | .digest' || echo "")

        if [ -z "$RELATED_IMAGES_DIGEST" ]; then
          echo "ERROR: No related-images artifact found (not a Konflux CI build?)"
          echo "unknown" > $(results.operatorNVR.path)
          exit 0
        fi

        echo "Related-images artifact: $RELATED_IMAGES_DIGEST"

        WORK_DIR="/tmp/related-images-$$"
        mkdir -p "$WORK_DIR"
        cd "$WORK_DIR"

        FBC_REPO=$(echo "$FBC_IMAGE" | sed 's/@sha256:.*//' | sed 's/:.*$//')
        oras pull "${FBC_REPO}@${RELATED_IMAGES_DIGEST}" 2>&1 | grep -E "Downloaded|Pulled"

        if [ ! -f "related-images.json" ]; then
          echo "ERROR: Failed to pull related-images.json"
          cd /
          rm -rf "$WORK_DIR"
          echo "unknown" > $(results.operatorNVR.path)
          exit 0
        fi

        # Find bundle image
        BUNDLE_IMAGE=$(cat related-images.json | \
          jq -r '.[]' | \
          grep -i "operator.*bundle\|bundle.*operator" | head -1 || echo "")

        if [ -z "$BUNDLE_IMAGE" ]; then
          echo "ERROR: No bundle image found in related-images"
          cd /
          rm -rf "$WORK_DIR"
          echo "unknown" > $(results.operatorNVR.path)
          exit 0
        fi

        # Inspect bundle for NVR
        REGISTRY_CONFIG_ARG=""
        if [ -f /stage-pull-secret/.dockerconfigjson ]; then
          REGISTRY_CONFIG_ARG="--registry-config=/stage-pull-secret/.dockerconfigjson"
        fi

        BUNDLE_NVR=""

        for REGISTRY_URL in "registry.stage.redhat.io" "registry.redhat.io"; do
          TEST_IMAGE="${BUNDLE_IMAGE//registry.redhat.io/$REGISTRY_URL}"

          IMAGE_INFO=$(oc image info "$TEST_IMAGE" \
            --filter-by-os linux/amd64 \
            $REGISTRY_CONFIG_ARG \
            -o json 2>&1)

          if [ $? -eq 0 ]; then
            # Try to get NVR from label
            BUNDLE_NVR=$(echo "$IMAGE_INFO" | jq -r '.config.config.Labels["com.redhat.art.nvr"] // empty' 2>/dev/null || echo "")

            if [ -n "$BUNDLE_NVR" ]; then
              break
            fi

            # Construct from component+version+release labels
            COMPONENT=$(echo "$IMAGE_INFO" | jq -r '.config.config.Labels["com.redhat.component"] // empty' 2>/dev/null)
            VERSION=$(echo "$IMAGE_INFO" | jq -r '.config.config.Labels["version"] // empty' 2>/dev/null)
            RELEASE=$(echo "$IMAGE_INFO" | jq -r '.config.config.Labels["release"] // empty' 2>/dev/null)

            if [ -n "$COMPONENT" ] && [ -n "$VERSION" ] && [ -n "$RELEASE" ]; then
              BUNDLE_NVR="${COMPONENT}-${VERSION}-${RELEASE}"
              break
            fi
          fi
        done

        cd /
        rm -rf "$WORK_DIR"

        if [ -z "$BUNDLE_NVR" ]; then
          echo "ERROR: Could not extract or construct bundle NVR"
          echo "unknown" > $(results.operatorNVR.path)
          exit 0
        fi

        # Transform bundle NVR to operator NVR
        # Bundle: mta-operator-metadata-container-8.2.1-...-1
        # Operator: mta-operator-container-8.2.1-...
        OPERATOR_NVR=$(echo "$BUNDLE_NVR" | sed 's/-metadata-container/-container/' | sed 's/-[0-9]*$//')

        echo "Operator NVR: $OPERATOR_NVR"

        # VALIDATION: Check if FBC catalog is consistent with related-images
        echo ""
        echo "Validating FBC catalog consistency..."

        # Install opm if not available
        if ! command -v opm &> /dev/null; then
          OPM_VERSION="v1.49.0"
          curl -sL "https://github.com/operator-framework/operator-registry/releases/download/${OPM_VERSION}/linux-amd64-opm" \
            -o /usr/local/bin/opm
          chmod +x /usr/local/bin/opm
        fi

        # Extract version from NVR (e.g., mta-operator-container-8.2.1-... → 8.2.1)
        NVR_VERSION=$(echo "$OPERATOR_NVR" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)

        # Detect channel from snapshot application name
        APP_NAME=$(echo "$SNAPSHOT_JSON" | grep -o '"application":"[^"]*"' | cut -d'"' -f4 || echo "")
        if [ -n "$APP_NAME" ]; then
          MINOR_VERSION=$(echo "$APP_NAME" | grep -oE '[0-9]+-[0-9]+' | tr '-' '.')
          CHANNEL_NAME="stable-v${MINOR_VERSION}"
        else
          echo "WARNING: Could not determine channel name, skipping validation"
          echo -n "$OPERATOR_NVR" > $(results.operatorNVR.path)
          exit 0
        fi

        echo "Checking catalog channel: $CHANNEL_NAME"

        # Get channel HEAD from catalog
        CATALOG_HEAD=$(opm render "$FBC_IMAGE" 2>/dev/null | \
          jq -r --arg channel "$CHANNEL_NAME" \
            'select(.schema=="olm.channel" and .name==$channel) | .entries[-1].name' 2>/dev/null || echo "")

        if [ -z "$CATALOG_HEAD" ]; then
          echo "WARNING: Could not extract catalog channel HEAD, skipping validation"
          echo -n "$OPERATOR_NVR" > $(results.operatorNVR.path)
          exit 0
        fi

        # Extract version from catalog HEAD (e.g., mta-operator.v8.2.1 → 8.2.1)
        CATALOG_VERSION=$(echo "$CATALOG_HEAD" | sed 's/.*\.v//')

        echo "Version from related-images: $NVR_VERSION"
        echo "Version from catalog HEAD:   $CATALOG_VERSION"

        if [ "$NVR_VERSION" != "$CATALOG_VERSION" ]; then
          echo ""
          echo "=========================================="
          echo "ERROR: FBC CATALOG INCONSISTENCY DETECTED"
          echo "=========================================="
          echo ""
          echo "The FBC snapshot is inconsistent:"
          echo "  - related-images.json shows: $NVR_VERSION"
          echo "  - Catalog channel HEAD is:   $CATALOG_VERSION"
          echo ""
          echo "This means the FBC was built with $NVR_VERSION bundle references,"
          echo "but the catalog only has $CATALOG_VERSION available to install."
          echo ""
          echo "OLM will deploy $CATALOG_VERSION but NVR extraction reports $NVR_VERSION."
          echo ""
          echo "FIX REQUIRED: Update the FBC source repository catalog to include"
          echo "the $NVR_VERSION bundle in the $CHANNEL_NAME channel."
          echo ""
          echo "Snapshot: $SNAPSHOT_NAME"
          echo "FBC Image: $FBC_IMAGE"
          echo "=========================================="
          exit 1
        fi

        echo "✅ Validation passed: Catalog is consistent"
        echo -n "$OPERATOR_NVR" > $(results.operatorNVR.path)
