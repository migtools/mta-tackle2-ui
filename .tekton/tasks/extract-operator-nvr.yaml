apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: extract-operator-nvr
  labels:
    app.kubernetes.io/version: "0.1"
  annotations:
    tekton.dev/pipelines.minVersion: "0.12.1"
    tekton.dev/categories: Utility
    tekton.dev/tags: metadata,nvr
    tekton.dev/displayName: "Extract Operator NVR"
spec:
  description: >-
    Extract operator NVR from FBC snapshot using Konflux-attached related-images artifact.
    Uses oras to discover and pull the related-images.json artifact, then inspects the
    operator image for the com.redhat.art.nvr label.

  params:
    - name: snapshotJson
      type: string
      description: Konflux snapshot JSON from pipeline
    - name: registryPullSecretName
      type: string
      default: "registry-pull-secrets"
      description: Name of the Kubernetes Secret containing stage registry pull credentials
    - name: channelName
      type: string
      default: "stable-v8.2"
      description: OLM channel name (not used in oras approach, kept for compatibility)

  results:
    - name: operatorNVR
      description: Full operator NVR (e.g., mta-operator-container-8.2.1-...)

  volumes:
    - name: stage-pull-secret
      secret:
        secretName: $(params.registryPullSecretName)
        optional: true

  steps:
    - name: extract-nvr
      image: registry.redhat.io/openshift4/ose-cli:latest
      volumeMounts:
        - name: stage-pull-secret
          mountPath: /stage-pull-secret
      script: |
        #!/bin/bash
        set -euo pipefail

        SNAPSHOT_JSON='$(params.snapshotJson)'

        echo "========================================="
        echo "Extract Operator NVR (Approach B: oras)"
        echo "========================================="
        echo ""

        # Install required tools
        echo "Installing dependencies..."

        # Install jq
        if ! command -v jq &> /dev/null; then
          curl -sL https://github.com/jqlang/jq/releases/download/jq-1.7.1/jq-linux-amd64 -o /usr/local/bin/jq
          chmod +x /usr/local/bin/jq
        fi

        # Install oras
        if ! command -v oras &> /dev/null; then
          ORAS_VERSION="1.2.0"
          curl -sL "https://github.com/oras-project/oras/releases/download/v${ORAS_VERSION}/oras_${ORAS_VERSION}_linux_amd64.tar.gz" | \
            tar -xz -C /usr/local/bin oras
          chmod +x /usr/local/bin/oras
        fi

        echo "✓ Dependencies installed"
        echo ""

        # Extract FBC application from snapshot JSON
        FBC_APP=$(echo "$SNAPSHOT_JSON" | jq -r '.application // ""')

        if [ -z "$FBC_APP" ]; then
          echo "Warning: Could not extract application from snapshot JSON"
          FBC_APP="fbc-mta-8-2"
        fi

        echo "FBC Application: $FBC_APP"
        echo ""

        # Get latest FBC snapshot for the application
        FBC_SNAPSHOT=$(oc get snapshots -n art-mta-tenant \
          -l appstudio.openshift.io/application=$FBC_APP \
          --sort-by=.metadata.creationTimestamp \
          -o jsonpath='{.items[-1].metadata.name}' 2>/dev/null || echo "")

        if [ -z "$FBC_SNAPSHOT" ]; then
          echo "❌ No FBC snapshot found for application: $FBC_APP"
          echo "unknown" > $(results.operatorNVR.path)
          exit 0
        fi

        echo "FBC Snapshot: $FBC_SNAPSHOT"
        echo ""

        # Get FBC image reference
        FBC_IMAGE=$(oc get snapshot $FBC_SNAPSHOT -n art-mta-tenant -o json | \
          jq -r '.spec.components[0].containerImage')

        if [ -z "$FBC_IMAGE" ]; then
          echo "❌ Could not extract FBC image from snapshot"
          echo "unknown" > $(results.operatorNVR.path)
          exit 0
        fi

        echo "FBC Image: $FBC_IMAGE"
        echo ""

        # Step 1: Discover related-images artifact
        echo "Step 1: Discovering related-images artifact..."
        echo "----------------------------------------------"

        RELATED_IMAGES_DIGEST=$(oras discover --format json "$FBC_IMAGE" 2>/dev/null | \
          jq -r '.manifests[]? | select(.annotations.attachedMediaType == "application/vnd.konflux-ci.attached-artifact.related-images+json") | .digest' || echo "")

        if [ -z "$RELATED_IMAGES_DIGEST" ]; then
          echo "❌ No related-images artifact found for FBC image"
          echo "   This might not be a Konflux CI build"
          echo "unknown" > $(results.operatorNVR.path)
          exit 0
        fi

        echo "✓ Found related-images artifact: $RELATED_IMAGES_DIGEST"
        echo ""

        # Step 2: Pull related-images.json artifact
        echo "Step 2: Pulling related-images.json..."
        echo "---------------------------------------"

        WORK_DIR="/tmp/related-images-$$"
        mkdir -p "$WORK_DIR"
        cd "$WORK_DIR"

        # Extract repository from FBC_IMAGE
        FBC_REPO=$(echo "$FBC_IMAGE" | sed 's/@sha256:.*//' | sed 's/:.*$//')

        oras pull "${FBC_REPO}@${RELATED_IMAGES_DIGEST}" 2>&1

        if [ ! -f "related-images.json" ]; then
          echo "❌ Failed to pull related-images.json"
          cd /
          rm -rf "$WORK_DIR"
          echo "unknown" > $(results.operatorNVR.path)
          exit 0
        fi

        echo "✓ Downloaded related-images.json ($(wc -l < related-images.json) images)"
        echo ""

        # Step 3: Find operator image from related images
        echo "Step 3: Finding operator image..."
        echo "---------------------------------"

        # Filter for operator images (exclude bundle, addon, provider, and other components)
        OPERATOR_CANDIDATES=$(cat related-images.json | \
          jq -r '.[]' | \
          grep -i "operator" | \
          grep -v "bundle" | \
          grep -v "addon" | \
          grep -v "provider" | \
          grep -v "/hub" | \
          grep -v "/ui" | \
          grep -v "/cli" || echo "")

        if [ -z "$OPERATOR_CANDIDATES" ]; then
          echo "❌ No operator image candidates found in related-images.json"
          echo ""
          echo "Available images:"
          cat related-images.json | jq -r '.[]'
          cd /
          rm -rf "$WORK_DIR"
          echo "unknown" > $(results.operatorNVR.path)
          exit 0
        fi

        echo "Operator candidate images:"
        echo "$OPERATOR_CANDIDATES"
        echo ""

        # Check for pull secret
        REGISTRY_CONFIG_ARG=""
        if [ -f /stage-pull-secret/.dockerconfigjson ]; then
          REGISTRY_CONFIG_ARG="--registry-config=/stage-pull-secret/.dockerconfigjson"
          echo "✓ Using registry pull secret"
        else
          echo "⚠️  No registry pull secret found, trying without credentials"
        fi
        echo ""

        # Step 4: Inspect each candidate to find the one with mta-operator-container NVR
        echo "Step 4: Inspecting operator candidates for NVR..."
        echo "--------------------------------------------------"

        OPERATOR_NVR=""
        OPERATOR_IMAGE=""

        while IFS= read -r CANDIDATE_IMAGE; do
          echo "Checking: $CANDIDATE_IMAGE"

          # Try stage registry first, then production registry
          for REGISTRY_URL in "registry.stage.redhat.io" "registry.redhat.io"; do
            TEST_IMAGE="${CANDIDATE_IMAGE//registry.redhat.io/$REGISTRY_URL}"

            if [ "$REGISTRY_URL" = "registry.stage.redhat.io" ]; then
              echo "  Trying stage registry..."
            else
              echo "  Trying production registry..."
            fi

            # Inspect image for com.redhat.art.nvr label
            IMAGE_INFO=$(oc image info "$TEST_IMAGE" \
              --filter-by-os linux/amd64 \
              $REGISTRY_CONFIG_ARG \
              -o json 2>&1)

            if [ $? -eq 0 ]; then
              # Successfully retrieved image info
              NVR=$(echo "$IMAGE_INFO" | jq -r '.config.config.Labels["com.redhat.art.nvr"] // empty' 2>/dev/null || echo "")

              if [ -n "$NVR" ]; then
                echo "  Found NVR: $NVR"

                # Check if this is the operator container (not metadata/bundle)
                if [[ "$NVR" == mta-operator-container-* ]]; then
                  OPERATOR_NVR="$NVR"
                  OPERATOR_IMAGE="$CANDIDATE_IMAGE"
                  echo "  ✓ This is the operator!"
                  break 2
                else
                  echo "  ⊘ Not the operator container (might be bundle/metadata)"
                  break
                fi
              else
                # No NVR label found, dump all labels for debugging
                echo "  ⊘ No com.redhat.art.nvr label found"
                echo "  Available labels:"
                echo "$IMAGE_INFO" | jq -r '.config.config.Labels | to_entries[] | "    \(.key) = \(.value)"' 2>/dev/null | head -10 || echo "    (could not extract labels)"
                break
              fi
            else
              echo "  ⊘ Could not access image: $(echo "$IMAGE_INFO" | grep -o 'error:.*' | head -1)"
            fi
          done

          echo ""
        done <<< "$OPERATOR_CANDIDATES"

        if [ -z "$OPERATOR_NVR" ]; then
          echo "❌ Could not find operator container NVR"
          echo "   Looked for NVR matching pattern: mta-operator-container-*"
          cd /
          rm -rf "$WORK_DIR"
          echo "unknown" > $(results.operatorNVR.path)
          exit 0
        fi

        echo "✓ Operator image: $OPERATOR_IMAGE"
        echo ""

        # Cleanup
        cd /
        rm -rf "$WORK_DIR"

        if [ -z "$OPERATOR_NVR" ]; then
          echo "❌ com.redhat.art.nvr label not found on operator image"
          echo "unknown" > $(results.operatorNVR.path)
          exit 0
        fi

        echo ""
        echo "========================================="
        echo "✅ Operator NVR extracted successfully:"
        echo "   $OPERATOR_NVR"
        echo "========================================="

        echo -n "$OPERATOR_NVR" > $(results.operatorNVR.path)
