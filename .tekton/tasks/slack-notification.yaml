apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: slack-notification
  labels:
    app.kubernetes.io/version: "0.1"
  annotations:
    tekton.dev/pipelines.minVersion: "0.12.1"
    tekton.dev/categories: Notification
    tekton.dev/tags: slack,notification
    tekton.dev/displayName: "Send Slack Notification"
spec:
  description: >-
    Send test results notification to Slack channel.
    Reports pipeline execution status, test results, and links to pipeline run.

  params:
    - name: testStatus
      type: string
      description: Test execution status (Succeeded/Failed)
    - name: pipelineRunName
      type: string
      description: Name of the pipeline run
    - name: fbcImage
      type: string
      default: ""
      description: FBC image reference (digest format)
    - name: SNAPSHOT
      type: string
      default: ""
      description: Konflux snapshot JSON (contains tagged image with NVR)
    - name: slackWebhookSecretName
      type: string
      default: "slack-webhook"
      description: Name of the Kubernetes Secret containing Slack webhook URL
    - name: slackWebhookSecretKey
      type: string
      default: "url"
      description: Key in the secret containing the webhook URL

  steps:
    - name: send-notification
      image: registry.redhat.io/openshift4/ose-cli:latest
      env:
        - name: SLACK_WEBHOOK_URL
          valueFrom:
            secretKeyRef:
              name: $(params.slackWebhookSecretName)
              key: $(params.slackWebhookSecretKey)
      script: |
        #!/bin/bash
        set -euo pipefail

        TEST_STATUS="$(params.testStatus)"
        PIPELINE_RUN="$(params.pipelineRunName)"
        FBC_IMAGE="$(params.fbcImage)"

        echo "Sending Slack notification for pipeline: $PIPELINE_RUN"
        echo "Test Status: $TEST_STATUS"

        # Determine status text
        if [ "$TEST_STATUS" = "Succeeded" ]; then
          STATUS_TEXT="PASSED"
        else
          STATUS_TEXT="FAILED"
        fi

        # Extract operator container NVR from bundle image labels
        # Strategy:
        # 1. Get FBC snapshot (fbc-mta-8-2 app)
        # 2. Find corresponding mta-8-2 snapshot (created just before FBC)
        # 3. Extract bundle image from mta-8-2 snapshot
        # 4. Inspect bundle image labels for operator NVR
        NVR=""

        # Get latest FBC snapshot
        FBC_APP="fbc-mta-8-2"
        FBC_SNAPSHOT=$(oc get snapshots -n art-mta-tenant \
          -l appstudio.openshift.io/application=$FBC_APP \
          --sort-by=.metadata.creationTimestamp \
          -o jsonpath='{.items[-1].metadata.name}' 2>/dev/null || echo "")

        if [ -n "$FBC_SNAPSHOT" ]; then
          echo "FBC snapshot: $FBC_SNAPSHOT"

          # Get FBC snapshot creation time
          FBC_TIME=$(oc get snapshot $FBC_SNAPSHOT -n art-mta-tenant \
            -o jsonpath='{.metadata.creationTimestamp}')

          # Find corresponding mta-8-2 snapshot (created before FBC)
          MTA_SNAPSHOT=$(oc get snapshots -n art-mta-tenant \
            -l appstudio.openshift.io/application=mta-8-2 \
            --sort-by=.metadata.creationTimestamp \
            -o json | \
            jq -r --arg fbc_time "$FBC_TIME" \
              '.items[] | select(.metadata.creationTimestamp < $fbc_time) | .metadata.name' | \
            tail -1)

          if [ -n "$MTA_SNAPSHOT" ]; then
            echo "Found mta-8-2 snapshot: $MTA_SNAPSHOT"

            # Get bundle image from mta-8-2 snapshot
            BUNDLE_IMAGE=$(oc get snapshot $MTA_SNAPSHOT -n art-mta-tenant -o json | \
              jq -r '.spec.components[] | select(.name == "mta-8-2-mta-operator-bundle") | .containerImage')

            if [ -n "$BUNDLE_IMAGE" ]; then
              echo "Bundle image: $BUNDLE_IMAGE"

              # Extract operator NVR from bundle image labels
              LABELS=$(oc image info $BUNDLE_IMAGE -o json 2>/dev/null | \
                jq -r '.config.config.Labels // {}')

              if [ -n "$LABELS" ] && [ "$LABELS" != "{}" ]; then
                COMPONENT=$(echo "$LABELS" | jq -r '."com.redhat.component" // ""')
                VERSION=$(echo "$LABELS" | jq -r '.version // ""')
                RELEASE=$(echo "$LABELS" | jq -r '.release // ""')

                if [ -n "$COMPONENT" ] && [ -n "$VERSION" ] && [ -n "$RELEASE" ]; then
                  NVR="${COMPONENT}-${VERSION}-${RELEASE}"
                  echo "✅ Extracted operator NVR from bundle labels: $NVR"
                fi
              fi
            fi
          fi
        fi

        # Fallback to digest if no NVR found
        if [ -z "$NVR" ] && [ -n "$FBC_IMAGE" ]; then
          echo "Using digest as fallback"
          if echo "$FBC_IMAGE" | grep -q '@sha256:'; then
            DIGEST=$(echo "$FBC_IMAGE" | sed 's/.*@sha256://' | cut -c1-12)
            NVR="sha256:${DIGEST}"
          fi
        fi

        echo "Final NVR: $NVR"

        # Construct Konflux UI link
        PIPELINE_LINK="https://konflux-ui.apps.kflux-ocp-p01.7ayg.p1.openshiftapps.com/ns/art-mta-tenant/applications/fbc-mta-8-2/pipelineruns/$PIPELINE_RUN"

        # Construct message for Slack Workflow
        # Sends status, NVR, and pipeline variables to Slack workflow trigger
        # Workflow template: Test: {{status}}, Link: {{pipeline}}, NVR: {{NVR}}
        MESSAGE=$(cat <<EOF
        {
          "status": "$STATUS_TEXT",
          "NVR": "$NVR",
          "pipeline": "$PIPELINE_LINK"
        }
        EOF
        )

        # Install curl if not already present
        if ! command -v curl &> /dev/null; then
          echo "Installing curl..."
          if ! microdnf install -y curl; then
            echo "❌ Failed to install curl"
            exit 1
          fi
        else
          echo "✓ curl already installed"
        fi

        # Send to Slack
        echo "Sending notification to Slack..."
        HTTP_CODE=$(curl -X POST -H 'Content-type: application/json' \
          --data "$MESSAGE" \
          -w "%{http_code}" \
          -o /tmp/slack-response.txt \
          "$SLACK_WEBHOOK_URL")

        if [ "$HTTP_CODE" = "200" ]; then
          echo "✅ Slack notification sent successfully"
        else
          echo "⚠️ Failed to send Slack notification (HTTP $HTTP_CODE)"
          cat /tmp/slack-response.txt
        fi
