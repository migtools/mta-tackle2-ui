apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: run-dast-scan
  labels:
    app.kubernetes.io/version: "0.1"
  annotations:
    tekton.dev/pipelines.minVersion: "0.12.1"
    tekton.dev/categories: Security
    tekton.dev/tags: dast,security,zap
    tekton.dev/displayName: "Run DAST Security Scan"
spec:
  description: >-
    Run Dynamic Application Security Testing (DAST) using RapiDAST/ZAP scanner.
    Scans the MTA Hub API for security vulnerabilities.

  params:
    - name: clusterId
      type: string
      description: OCPCTL cluster ID for connecting to the cluster
    - name: mtaRoute
      type: string
      description: MTA route URL (without /hub suffix)

  results:
    - name: scanStatus
      description: DAST scan execution status (Succeeded/Failed)

  steps:
    - name: clone-rapidast
      image: registry.redhat.io/ubi9/ubi:latest
      script: |
        #!/bin/bash
        set -euo pipefail

        echo "=== Cloning RapiDAST Repository ==="

        # Install git
        echo "Installing git..."
        dnf install -y git

        echo "Cloning from GitHub..."
        cd /workspace

        # Check if already exists
        if [ -d "rapidast" ]; then
          echo "WARNING: rapidast directory already exists, removing it"
          rm -rf rapidast
        fi

        git clone https://github.com/RedHatProductSecurity/rapidast.git
        cd rapidast
        git checkout development

        echo ""
        echo "OK: RapiDAST cloned successfully"
        echo "Current directory: $(pwd)"
        echo "RapiDAST files: $(ls -la | wc -l) files"
        echo ""

    - name: connect-to-cluster
      image: registry.redhat.io/openshift4/ose-cli:latest
      env:
        - name: OCPCTL_API_KEY
          valueFrom:
            secretKeyRef:
              name: ocpctl-ci-key
              key: api-key
      script: |
        #!/bin/bash
        set -euo pipefail

        CLUSTER_ID="$(params.clusterId)"
        KUBECONFIG_PATH="/workspace/kubeconfig"
        OCPCTL_URL="https://ocpctl.mg.dog8code.com/api/v1"

        echo "=== Downloading Admin Kubeconfig ==="
        echo "Cluster ID: $CLUSTER_ID"
        echo "OCPCTL URL: $OCPCTL_URL"

        # Step 1: Get pre-signed download URL from OCPCTL API
        echo "Step 1: Getting pre-signed S3 URL from OCPCTL..."
        echo "API Endpoint: $OCPCTL_URL/clusters/$CLUSTER_ID/kubeconfig/download-url"

        DOWNLOAD_URL_RESPONSE=$(curl -s -H "Authorization: Bearer $OCPCTL_API_KEY" \
          "$OCPCTL_URL/clusters/$CLUSTER_ID/kubeconfig/download-url")

        echo "API Response received (length: ${#DOWNLOAD_URL_RESPONSE} bytes)"
        echo "Response content: '$DOWNLOAD_URL_RESPONSE'"

        # Extract download URL (no jq available)
        echo "Step 2: Extracting download URL from response..."
        DOWNLOAD_URL=$(echo "$DOWNLOAD_URL_RESPONSE" | grep -o '"download_url":"[^"]*"' | cut -d'"' -f4 | sed 's/\\u0026/\&/g')

        if [ -z "$DOWNLOAD_URL" ]; then
          echo "ERROR: Failed to extract kubeconfig download URL"
          echo "Full Response:"
          echo "$DOWNLOAD_URL_RESPONSE"
          exit 1
        fi

        echo "OK: Got pre-signed S3 URL (expires in 15 minutes)"

        # Step 3: Download admin kubeconfig from S3
        echo "Step 3: Downloading kubeconfig from S3..."
        HTTP_CODE=$(curl -s -o "$KUBECONFIG_PATH" -w "%{http_code}" "$DOWNLOAD_URL")

        echo "HTTP Response Code: $HTTP_CODE"

        if [ "$HTTP_CODE" != "200" ]; then
          echo "ERROR: Failed to download kubeconfig from S3 (HTTP $HTTP_CODE)"
          echo "File contents:"
          cat "$KUBECONFIG_PATH"
          exit 1
        fi

        echo "OK: Kubeconfig downloaded successfully"
        echo "Kubeconfig size: $(wc -c < $KUBECONFIG_PATH) bytes"

        export KUBECONFIG="$KUBECONFIG_PATH"

        # Verify connection
        echo "Step 4: Verifying cluster connection..."
        echo "Checking who am I..."
        oc whoami

        echo ""
        echo "=== Successfully Connected to Cluster ==="
        echo "User: $(oc whoami)"
        echo "Cluster: $(oc whoami --show-server || echo 'unknown')"
        echo ""

    - name: disable-auth
      image: registry.redhat.io/openshift4/ose-cli:latest
      script: |
        #!/bin/bash
        set -euo pipefail

        export KUBECONFIG=/workspace/kubeconfig

        echo "=== MTA Deployment Status Check ==="

        # Debug: Show deployments in openshift-mta
        echo "Deployments in openshift-mta:"
        oc get deployments -n openshift-mta 2>&1 || echo "Namespace may not exist or no deployments"

        echo ""
        echo "Pods in openshift-mta:"
        oc get pods -n openshift-mta 2>&1 || echo "No pods found"

        echo ""
        echo "Checking for Tackle resources..."
        oc get tackle -n openshift-mta 2>&1 || echo "No Tackle resources found or CRD not installed"

        echo ""
        echo "=== Checking MTA Authentication Status ==="

        # Check if MTA Tackle CR exists (try 'mta' name)
        if ! oc get tackle mta -n openshift-mta &>/dev/null; then
          echo "ERROR: MTA Tackle CR 'mta' not found in openshift-mta namespace"
          echo ""
          echo "Trying to list available Tackle resources:"
          oc get tackle -n openshift-mta 2>&1 || echo "Cannot list Tackle resources"

          echo ""
          echo "Checking if namespace exists:"
          oc get namespace openshift-mta 2>&1 || echo "Namespace openshift-mta not found"

          exit 1
        fi

        echo "OK: Found Tackle CR 'mta'"

        # Check if auth is enabled (parse JSON without jq)
        FEATURE_AUTH_ENABLED=$(oc get tackle mta -n openshift-mta -o jsonpath='{.spec.feature_auth_required}')

        # Default to false if empty
        if [ -z "$FEATURE_AUTH_ENABLED" ]; then
          FEATURE_AUTH_ENABLED="false"
        fi

        echo "feature_auth_required: $FEATURE_AUTH_ENABLED"

        if [ "$FEATURE_AUTH_ENABLED" = "true" ]; then
          echo "Disabling authentication for DAST scan..."

          # Get current UI pod name
          UI_POD_NAME=$(oc get pod -n openshift-mta -l app.kubernetes.io/name=mta-ui \
            -o jsonpath='{.items[0].metadata.name}')

          echo "Current UI pod: $UI_POD_NAME"

          # Disable auth
          oc patch tackle tackle -n openshift-mta --type=merge \
            -p '{"spec":{"feature_auth_required": "false"}}'

          echo "Waiting for UI pod to restart..."
          # Wait for old pod to terminate
          timeout 300 bash -c "while oc get pod $UI_POD_NAME -n openshift-mta &>/dev/null; do sleep 5; done" || true

          # Wait for new pod to be ready
          oc wait --for=condition=Ready pod -l app.kubernetes.io/name=mta-ui \
            -n openshift-mta --timeout=300s

          echo "OK: Authentication disabled"
          echo "true" > /workspace/auth-was-enabled
        else
          echo "OK: Authentication already disabled"
          echo "false" > /workspace/auth-was-enabled
        fi

    - name: prepare-config
      image: registry.redhat.io/ubi9/python-311:latest
      script: |
        #!/bin/bash
        set -euo pipefail

        MTA_ROUTE="$(params.mtaRoute)"
        HUB_URL="${MTA_ROUTE}/hub"

        echo "Creating DAST configuration..."
        echo "Hub URL: $HUB_URL"

        # Create DAST configuration file
        {
          echo "config:"
          echo "  configVersion: 5"
          echo "  base_results_dir: \"/workspace/dast-results\""
          echo ""
          echo "application:"
          echo "  shortName: \"MTA\""
          echo "  url: \"$HUB_URL\""
          echo ""
          echo "general:"
          echo "  container:"
          echo "    type: \"podman\""
          echo ""
          echo "scanners:"
          echo "  zap:"
          echo "    apiScan:"
          echo "      apis:"
          echo "        apiUrl: \"https://raw.githubusercontent.com/konveyor/tackle2-hub/main/docs/openapi3.json\""
          echo ""
          echo "    passiveScan:"
          echo "      disabledRules: \"2,10015,10024,10027,10054,10096,10109,10112\""
          echo ""
          echo "    activeScan:"
          echo "      policy: \"API-scan-minimal\""
          echo ""
          echo "    miscOptions:"
          echo "      additionalAddons: \"ascanrulesBeta\""
        } > /workspace/dast-config.yaml

        echo "DAST configuration created"
        cat /workspace/dast-config.yaml

    - name: run-dast
      image: registry.redhat.io/ubi9/python-311:latest
      script: |
        #!/bin/bash
        set -euo pipefail

        echo "Installing RapiDAST dependencies..."
        cd /workspace/rapidast

        # Install pipenv and dependencies
        pip install --upgrade pip
        pip install pipenv
        pipenv run pip install -r requirements.txt

        echo "Starting DAST scan..."
        echo "WARNING:  This may take 30-60 minutes..."

        mkdir -p /workspace/dast-results

        # Run RapiDAST
        pipenv run python rapidast.py \
          --config /workspace/dast-config.yaml \
          --log-level debug || {
            echo "WARNING:  DAST scan encountered issues (exit code: $?)"
            echo "Continuing to process results..."
          }

        echo "OK: DAST scan completed"

        # List results
        echo "Scan results:"
        ls -lah /workspace/dast-results/ || echo "No results directory found"

        # Check for report
        if [ -f /workspace/dast-results/zap-report.html ]; then
          echo "OK: ZAP report generated"
        else
          echo "WARNING:  No ZAP report found"
        fi

    - name: re-enable-auth
      image: registry.redhat.io/openshift4/ose-cli:latest
      script: |
        #!/bin/bash
        set -euo pipefail

        export KUBECONFIG=/workspace/kubeconfig

        # Check if we disabled auth earlier
        if [ -f /workspace/auth-was-enabled ] && [ "$(cat /workspace/auth-was-enabled)" = "true" ]; then
          echo "Re-enabling authentication..."

          # Get current UI pod name
          UI_POD_NAME=$(oc get pod -n openshift-mta -l app.kubernetes.io/name=mta-ui \
            -o jsonpath='{.items[0].metadata.name}')

          # Re-enable auth
          oc patch tackle tackle -n openshift-mta --type=merge \
            -p '{"spec":{"feature_auth_required": "true"}}'

          echo "Waiting for UI pod to restart..."
          # Wait for old pod to terminate
          timeout 300 bash -c "while oc get pod $UI_POD_NAME -n openshift-mta &>/dev/null; do sleep 5; done" || true

          # Wait for new pod to be ready
          oc wait --for=condition=Ready pod -l app.kubernetes.io/name=mta-ui \
            -n openshift-mta --timeout=300s

          echo "OK: Authentication re-enabled"
        else
          echo "OK: Authentication was not modified, no action needed"
        fi

    - name: process-results
      image: registry.redhat.io/ubi9/ubi:latest
      script: |
        #!/bin/bash
        set -euo pipefail

        echo "Processing DAST scan results..."

        # Check if results exist
        if [ ! -d /workspace/dast-results ]; then
          echo "❌ No results directory found"
          echo "Failed" > $(results.scanStatus.path)
          exit 1
        fi

        # List all result files
        echo "Result files:"
        find /workspace/dast-results -type f

        # Check for critical findings (you can customize this logic)
        # For now, just mark as succeeded if scan completed
        echo "Succeeded" > $(results.scanStatus.path)
        echo "OK: DAST scan results processed"

  workspaces:
    []
