apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: ocpctl-kubeconfig
  labels:
    app.kubernetes.io/version: "0.1"
  annotations:
    tekton.dev/pipelines.minVersion: "0.12.1"
    tekton.dev/categories: Deployment
    tekton.dev/tags: ocpctl,openshift,cluster,kubeconfig
    tekton.dev/displayName: "OCPCTL Get Kubeconfig"
spec:
  description: >-
    Download kubeconfig for an OCPCTL cluster and write it to a workspace.
    Useful as a standalone task when you need cluster access without deploying an operator.

  params:
    - name: clusterId
      type: string
      description: UUID of the cluster
    - name: ocpctlUrl
      type: string
      default: "https://ocpctl.mg.dog8code.com/api/v1"
      description: OCPCTL API base URL
    - name: ocpctlSecretName
      type: string
      default: "ocpctl-api-key"
      description: Name of the Kubernetes Secret containing the OCPCTL API key

  results:
    - name: kubeconfigPath
      description: Path where the kubeconfig was written

  workspaces:
    - name: credentials
      description: Workspace to write the kubeconfig file

  steps:
    - name: download-kubeconfig
      image: registry.access.redhat.com/ubi9/ubi-minimal@sha256:b87097994fec391e6d6abdb8a3f9e14c09192683b3489c929f8298bce3f3afbe
      env:
        - name: OCPCTL_API_KEY
          valueFrom:
            secretKeyRef:
              name: $(params.ocpctlSecretName)
              key: api-key
      script: |
        #!/bin/bash
        set -euo pipefail

        OCPCTL_URL="$(params.ocpctlUrl)"
        CLUSTER_ID="$(params.clusterId)"
        KUBECONFIG_PATH="$(workspaces.credentials.path)/kubeconfig"

        echo "Downloading kubeconfig for cluster $CLUSTER_ID..."

        HTTP_CODE=$(curl -s -o "$KUBECONFIG_PATH" -w "%{http_code}" \
          -H "Authorization: Bearer $OCPCTL_API_KEY" \
          "$OCPCTL_URL/clusters/$CLUSTER_ID/kubeconfig")

        if [ "$HTTP_CODE" != "200" ]; then
          echo "❌ Failed to download kubeconfig (HTTP $HTTP_CODE)"
          cat "$KUBECONFIG_PATH"
          exit 1
        fi

        echo "✅ Kubeconfig saved to $KUBECONFIG_PATH"
        echo -n "$KUBECONFIG_PATH" > $(results.kubeconfigPath.path)
